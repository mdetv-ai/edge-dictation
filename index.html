<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edge Voice Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin:0; font-family:Arial, sans-serif; background:#111; color:#fff; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .big-btn {
    width:80%; max-width:700px; height:130px; font-size:34px; background:#00d4ff; color:#000; border:none;
    border-radius:25px; cursor:pointer;
  }
  .big-btn.listening { background:#ff3b5c; }
  .status { font-size:22px; margin:20px 0; min-height:30px; text-align:center; }
  .transcript { width:80%; background:#222; padding:20px; border-radius:12px; min-height:150px; font-size:19px; line-height:1.5; white-space:pre-wrap; }
</style>
</head>
<body>

<h2>🎤 Edge Voice Notes — Tap to Speak</h2>
<button id="micBtn" class="big-btn">TAP TO START SPEAKING</button>
<div id="status" class="status"></div>
<div id="transcript" class="transcript"></div>

<script>
  const micBtn = document.getElementById('micBtn');
  const statusEl = document.getElementById('status');
  const transcriptEl = document.getElementById('transcript');

  let recognition;
  let isListening = false;

  function init() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      statusEl.innerHTML = '❌ Voice input not supported.<br>Use latest Chrome or Edge.';
      return;
    }
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';

    recognition.onresult = function(event) {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      transcriptEl.textContent = transcript;
    };

    statusEl.textContent = '✅ Ready — tap the big button and speak!';
  }

  function startListening() {
    if (!recognition) init();
    recognition.start();
    isListening = true;
    micBtn.textContent = 'TAP TO STOP';
    micBtn.classList.add('listening');
    statusEl.textContent = '🎙️ Listening... speak now';
  }

  function stopListening() {
    if (recognition) recognition.stop();
    isListening = false;
    micBtn.textContent = 'TAP TO START SPEAKING';
    micBtn.classList.remove('listening');
    statusEl.textContent = '✅ Stopped';
  }

  micBtn.addEventListener('click', function() {
    if (isListening) {
      stopListening();
    } else {
      startListening();
    }
  });

  // Start the app
  init();
</script>
</body>
</html>
